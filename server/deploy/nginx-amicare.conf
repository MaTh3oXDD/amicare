# /etc/nginx/sites-available/amicare
# Front i API z jednej domeny - dzięki temu formularze działają na ścieżce
# względnej /api i nie potrzebują CORS-a.
#
# Po wklejeniu:
#   sudo ln -s /etc/nginx/sites-available/amicare /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Blok z HTTPS dopisze certbot.

server {
    listen 80;
    listen [::]:80;
    server_name amicare.pl www.amicare.pl;

    root /var/www/amicare;
    index index.html;

    # zgłoszenia z formularzy -> backend Node
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # pliki z hashem w nazwie - cache na rok
    location ~* \.(js|css|woff2|jpg|jpeg|png|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # routing Angulara - każda inna ścieżka dostaje index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
