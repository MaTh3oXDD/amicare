<app-page-hero
  title="Nasze placówki"
  lead="AmiCare Centrum Medyczne to nowoczesny ośrodek mający swoje siedziby w Łodzi oraz w Jeleniej Górze. Trzy placówki — jedna misja: pomagamy pacjentom przez naukę."
/>

<section class="section" aria-label="Lista placówek">
  <div class="container">
    <div class="list">
      @for (p of placowki; track p.slug; let i = $index) {
        <a class="row" [routerLink]="['/placowki', p.slug]">
          <span class="row__no mono">{{ i + 1 }} / 3</span>
          <div class="row__main">
            <span class="mono">{{ p.typ }}</span>
            <h2>{{ p.miasto }}<em>{{ p.adres ? ' · ' + p.adres.split(',')[0] : '' }}</em></h2>
            <p>{{ p.opis }}</p>
          </div>
          <div class="row__meta">
            @if (p.godziny) {
              <span class="mono row__hours">{{ p.godziny }}</span>
            }
            <span class="row__arrow" aria-hidden="true">→</span>
          </div>
        </a>
      }
    </div>
  </div>
</section>
