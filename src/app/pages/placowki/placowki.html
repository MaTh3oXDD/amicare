<app-page-hero
  title="Nasze placówki"
  lead="AmiCare Centrum Medyczne to nowoczesny ośrodek mający swoje siedziby w Łodzi oraz w Jeleniej Górze. Trzy placówki - jedna misja: pomagamy pacjentom przez naukę."
  photo="images/przychodnia/recepcja-lada.webp"
/>

<section class="section" aria-label="Lista placówek">
  <div class="container">
    <div class="list">
      @for (p of placowki; track p.slug; let i = $index) {
        <div class="row" [class.row--open]="isOpen(p.slug)">
          <div class="row__line">
            <span class="row__no mono">{{ i + 1 }} / 3</span>
            <a class="row__main" [routerLink]="['/placowki', p.slug]">
              <span class="mono">{{ p.typ }}</span>
              <h2>{{ p.miasto }}<em>{{ p.adres ? ' · ' + p.adres.split(',')[0] : '' }}</em></h2>
              <p>{{ p.opis }}</p>
            </a>
            <div class="row__meta">
              @if (p.godziny) {
                <span class="mono row__hours">{{ p.godziny }}</span>
              }
              <a class="row__arrow" [routerLink]="['/placowki', p.slug]" aria-hidden="true">→</a>
              <button
                type="button"
                class="row__toggle mono"
                [attr.aria-expanded]="isOpen(p.slug)"
                [attr.aria-label]="(isOpen(p.slug) ? 'Zwiń' : 'Rozwiń') + ' listę usług - ' + p.miasto"
                (click)="toggle(p.slug)"
              >
                <span class="row__toggle-icon" aria-hidden="true"></span>
                {{ isOpen(p.slug) ? 'Ukryj usługi' : 'Zobacz usługi' }}
              </button>
            </div>
          </div>

          @if (isOpen(p.slug)) {
            <ul class="row__zakres speclist">
              @for (z of p.zakres; track z.nazwa) {
                <li>
                  <a [routerLink]="z.link">
                    <span>{{ z.nazwa }}</span>
                    <span class="speclist__arrow" aria-hidden="true">→</span>
                  </a>
                </li>
              }
            </ul>
          }
        </div>
      }
    </div>
  </div>
</section>
