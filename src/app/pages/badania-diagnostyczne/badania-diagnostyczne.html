<app-page-hero
  title="Badania diagnostyczne"
  lead="Twoje zdrowie w najlepszych rękach."
  photo="images/przychodnia/sprzet-endoskopowy.webp"
/>

<section class="section section--cream">
  <div class="container grid grid--2 block">
    <div>
      <span class="eyebrow">Diagnostyka</span>
      <h2>Wszystkie badania w jednym miejscu</h2>
      <p>
        Od podstawowych badań laboratoryjnych po specjalistyczną diagnostykę obrazową - wybierz
        badanie z listy poniżej, aby poznać szczegóły i przygotowanie.
      </p>
    </div>
    <figure class="about-media">
      <img
        class="about-media__main"
        src="images/przychodnia/sprzet-endoskopowy.webp"
        alt="Nowoczesny sprzęt diagnostyczny w AmiCare"
        loading="lazy"
        width="1400"
        height="1867"
      />
      <img
        class="about-media__accent"
        src="images/przychodnia/gabinet-konsultacyjny.webp"
        alt="Gabinet diagnostyczny AmiCare"
        loading="lazy"
        width="1600"
        height="1200"
      />
      <figcaption class="mono">Diagnostyka - AmiCare</figcaption>
    </figure>
  </div>
</section>

<section class="section" aria-label="Lista badań diagnostycznych">
  <div class="container">
    <div class="grid grid--3">
      @for (b of badania; track b.nazwa) {
        <a class="diag" [routerLink]="b.link">
          <h3>{{ b.nazwa }}</h3>
          <span class="diag__arrow" aria-hidden="true">→</span>
        </a>
      }
    </div>
    <div class="cta">
      <a routerLink="/kontakt" class="btn btn--solid">Zarezerwuj wizytę</a>
      <a href="tel:+48422890250" class="btn btn--ghost">tel: 42 28 90 250</a>
    </div>
  </div>
</section>
